<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="回路工房">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>回路工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* 方眼の回路図用紙 ＋ KiCad風の配色（部品=えんじ、配線=緑）＋ オシロスコープ画面 */
:root{
  --paper:#EEF2EF; --panel:#FFFFFF; --ink:#18211D; --muted:#5A6962; --line:#D3DCD7; --grid:#BFCBC4;
  --part:#972237; --wire:#1D7646; --accent:#1F5BB8; --accent-ink:#FFFFFF; --sel:#D98200; --chip:#E3EAE6;
  --vpos:#E0472A; --vneg:#2479E0; --vzero:#7E8C85; --led:#FF3B2F;
  --scope:#0D1411; --scope-grid:#21302A; --scope-axis:#33473E; --scope-txt:#9DB3A8;
  --ch1:#F4CC2A; --ch2:#35D0E4; --ch3:#F060D2; --ch4:#4E8CFF;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111714; --panel:#18201C; --ink:#E3EBE6; --muted:#93A49B; --line:#2A3631; --grid:#2E3B35;
  --part:#F1828F; --wire:#4CC985; --accent:#76A6F7; --accent-ink:#0B1220; --sel:#FFB13B; --chip:#222C27;
  --vpos:#FF7A55; --vneg:#5AA2FF; --vzero:#6E7D76; --led:#FF5A48;
  --scope:#070B09; --scope-grid:#1B2721; --scope-axis:#2C3D35; --scope-txt:#8FA79B; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#111714; --panel:#18201C; --ink:#E3EBE6; --muted:#93A49B; --line:#2A3631; --grid:#2E3B35;
  --part:#F1828F; --wire:#4CC985; --accent:#76A6F7; --accent-ink:#0B1220; --sel:#FFB13B; --chip:#222C27;
  --vpos:#FF7A55; --vneg:#5AA2FF; --vzero:#6E7D76; --led:#FF5A48;
  --scope:#070B09; --scope-grid:#1B2721; --scope-axis:#2C3D35; --scope-txt:#8FA79B; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);max-width:1100px;margin:0 auto}
header.top{display:flex;align-items:baseline;gap:10px;padding-block:10px 6px;min-width:0}
.brand{font-family:var(--f-disp);font-weight:900;font-size:19px;letter-spacing:.06em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--muted);margin-left:6px}
.patname{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
main{min-height:0;min-width:0;position:relative}
.view{height:100%;min-height:0;min-width:0}

/* ---- エディタ ---- */
#v-edit{display:flex;flex-direction:column;gap:8px}
.simbar{display:flex;align-items:center;gap:6px;min-width:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.run.on{background:var(--sel);border-color:var(--sel);color:#1a1200}
.btn.ghost{background:transparent}
.btn.danger{color:var(--vpos);border-color:color-mix(in srgb,var(--vpos) 40%,var(--line))}
.btn[disabled]{opacity:.4}
.tdisp{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.stage{flex:1;min-height:120px;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:8px;top:8px;right:8px;font-size:11.5px;color:var(--muted);pointer-events:none;line-height:1.4;text-shadow:0 0 4px var(--paper),0 0 4px var(--paper)}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:16px;line-height:1;display:grid;place-items:center}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;font-size:12.5px;max-width:86%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

.scope{background:var(--scope);border-radius:12px;padding:6px 8px 8px;color:var(--scope-txt);flex:none}
.scopehead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 10px;font-family:var(--f-mono);font-size:11px;min-width:0}
.scopehead .ttl{letter-spacing:.06em;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px;height:34px;line-height:17px;overflow:hidden;font-variant-numeric:tabular-nums}
.legend span{white-space:pre;overflow:hidden;text-overflow:ellipsis}
@media (min-width:640px){ .legend{grid-template-columns:repeat(4,minmax(0,1fr));height:17px} }
.legend b{font-weight:600}
.scopehead button{background:none;border:1px solid var(--scope-axis);color:var(--scope-txt);border-radius:6px;font-size:11px;padding:1px 7px}
#sc{display:block;width:100%;height:118px;margin-top:4px}
.scope.collapsed #sc{display:none}

.palette{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex:none;scrollbar-width:thin}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:58px;padding:5px 6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:10.5px;line-height:1.2;color:var(--ink)}
.chip canvas{width:44px;height:26px;display:block}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.chip.tool{min-width:50px;font-weight:600}
.chip.tool .ic{font-size:16px;height:26px;display:grid;place-items:center;font-family:var(--f-mono)}
.pgroup{flex:none;writing-mode:vertical-rl;font-size:9.5px;letter-spacing:.2em;color:var(--muted);padding:2px 0;border-left:1px dashed var(--line);margin-left:2px}

.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:62%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 12px 12px}
.sheet h3{margin:0;font-size:15px;display:flex;align-items:baseline;gap:8px;min-width:0}
.sheet h3 .tn{font-size:12px;color:var(--muted);font-weight:400}
.sheet .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.field{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:8px;margin-top:8px}
.field label{font-size:12.5px;color:var(--muted)}
.field .in{display:flex;align-items:center;gap:6px;min-width:0}
.field input,.field select{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper);font-family:var(--f-mono)}
.field .u{font-family:var(--f-mono);color:var(--muted);font-size:12px;min-width:1.6em}
.readout{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px}
.readout dt{color:var(--muted)}
.readout dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.x{margin-left:auto;border:none;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 2px}

/* ---- 一覧ビュー ---- */
.scroll{height:100%;overflow:auto;padding-bottom:16px}
.vhead{padding-block:4px 10px}
.vhead h2{font-family:var(--f-disp);font-weight:900;font-size:20px;margin:0;text-wrap:balance}
.vhead p{margin:2px 0 0;color:var(--muted);font-size:12.5px;max-width:60ch}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:12px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.card canvas{width:100%;height:120px;display:block;background:var(--paper);border-bottom:1px solid var(--line)}
.card .cb{padding:8px 12px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .cat{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.card .nm{font-weight:600;font-size:15px}
.card .sm{font-size:12.5px;color:var(--muted);line-height:1.5}
.dgroup{margin:14px 0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.pitem{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;text-align:left;min-width:0}
.pitem canvas{width:64px;height:40px}
.pitem .nm{font-weight:600}
.pitem .en{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:6px}
.pitem .sm{font-size:12px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- 下部タブ ---- */
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:8px 8px}
nav.tabs button{border:none;background:none;padding:6px 4px;border-radius:10px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button .g{font-family:var(--f-mono);font-size:15px;line-height:1.1}
nav.tabs button.on{color:var(--ink);background:var(--chip);font-weight:600}

/* ---- モーダル（詳細） ---- */
.modal{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.mbox{background:var(--panel);width:100%;max-width:760px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:16px 16px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mtop{display:flex;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--panel);padding-block:4px 8px;z-index:1}
.mtop h2{font-family:var(--f-disp);font-weight:900;font-size:19px;margin:0;line-height:1.3;text-wrap:balance}
.mtop .en{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mbox h4{margin:16px 0 4px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.mbox p{margin:0;max-width:65ch}
.mbox ol{margin:0;padding-left:1.4em;max-width:65ch}
.mbox ol li{margin:4px 0}
.mbox ul{margin:0;padding-left:1.2em}
.big{width:100%;height:200px;display:block;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.sym{width:100%;height:120px;display:block;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.fbox{font-family:var(--f-mono);font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px;overflow-x:auto}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 11px;font-size:12px}
.note{border-left:3px solid var(--sel);padding:6px 10px;background:color-mix(in srgb,var(--sel) 9%,var(--panel));border-radius:0 8px 8px 0;font-size:13px;max-width:65ch}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.srow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
input[type=range]{width:100%}
@media (min-width:760px){ #sc{height:150px} .big{height:260px} }
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">回路工房<small>KAIRO KOBO</small></div>
    <div class="patname" id="patName"></div>
  </header>
  <main>
    <section id="v-edit" class="view">
      <div class="simbar">
        <button class="btn run" id="bRun">▶ 実行</button>
        <button class="btn" id="bReset" title="時間を0に戻す">リセット</button>
        <span class="sp"></span>
        <button class="btn" id="bExplain" hidden>解説</button>
        <button class="btn" id="bUndo">戻す</button>
        <button class="btn" id="bMenu" aria-label="メニュー">⋯</button>
      </div>
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="hint" id="hint"></div>
        <div class="zoom"><button id="zIn" aria-label="拡大">＋</button><button id="zOut" aria-label="縮小">−</button><button id="zFit" aria-label="全体表示">⤢</button></div>
        <div id="toast"></div>
        <div class="sheet" id="sheet" hidden></div>
      </div>
      <div class="scope" id="scope">
        <div class="scopehead"><span class="ttl" id="tdisp">t = 0 s</span><button id="bScope">隠す</button><div class="legend" id="legend"></div></div>
        <canvas id="sc"></canvas>
      </div>
      <div class="palette" id="palette"></div>
    </section>
    <section id="v-pat" class="view" hidden>
      <div class="scroll">
        <div class="vhead"><h2>回路パターン</h2><p>用途ごとの定番回路です。開くとエディタに読み込まれ、すぐにシミュレーションが始まります。</p></div>
        <div class="filters" id="patFilters"></div>
        <div class="cards" id="patCards"></div>
      </div>
    </section>
    <section id="v-doc" class="view" hidden>
      <div class="scroll">
        <div class="vhead"><h2>部品図鑑</h2><p>部品とICの役割、しくみ、計算式、使いどころ。記号はJIS式（抵抗は四角）で描いています。</p></div>
        <div id="docList"></div>
      </div>
    </section>
  </main>
  <nav class="tabs">
    <button data-v="edit" class="on"><span class="g">⌁</span>エディタ</button>
    <button data-v="pat"><span class="g">⊞</span>回路パターン</button>
    <button data-v="doc"><span class="g">▤</span>部品図鑑</button>
  </nav>
</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
/* ===== 回路工房 シミュレーションコア ===== */
const VT = 0.025852, GMIN = 1e-9;

function rotPt(x, y, r) { r = ((r % 4) + 4) % 4; return r === 0 ? [x, y] : r === 1 ? [-y, x] : r === 2 ? [-x, -y] : [y, -x]; }
const key = (x, y) => x + ',' + y;
function dexp(x) { return x > 80 ? Math.exp(80) * (1 + x - 80) : Math.exp(x); }
function pnjlim(vnew, vold, vt, vcrit) {
  if (vnew > vcrit && Math.abs(vnew - vold) > 2 * vt) {
    if (vold > 0) { const arg = 1 + (vnew - vold) / vt; vnew = arg > 0 ? vold + vt * Math.log(arg) : vcrit; }
    else vnew = vt * Math.log(vnew / vt);
  }
  return vnew;
}
function softmin(a, b, k) { const m = Math.min(a, b); return m - k * Math.log1p(Math.exp(-Math.abs(a - b) / k)); }
function softplus(x, k) { return x > 30 * k ? x : k * Math.log1p(Math.exp(x / k)); }

/* ---- SI 表記 ---- */
const PFX = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];
function fmtSI(v, unit, digits) {
  digits = digits || 3;
  if (!isFinite(v)) return '—';
  if (Math.abs(v) < 1e-13) return '0 ' + unit;
  const a = Math.abs(v);
  for (const [m, p] of PFX) {
    if (a >= m * 0.9995) return String(parseFloat((v / m).toPrecision(digits))) + ' ' + p + unit;
  }
  return String(parseFloat((v / 1e-12).toPrecision(digits))) + ' p' + unit;
}
function parseSI(str) {
  const m = String(str).trim().replace(/,/g, '').match(/^([-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?)\s*([GMkKmuµnp]?)/);
  if (!m) return NaN;
  const mul = { G: 1e9, M: 1e6, k: 1e3, K: 1e3, m: 1e-3, u: 1e-6, 'µ': 1e-6, n: 1e-9, p: 1e-12 }[m[2]] || 1;
  return parseFloat(m[1]) * mul;
}

/* ---- 部品定義 ---- */
const P2 = [[0, 0], [2, 0]];
const pv = (e, s, i) => s.v(e.n[i]);

function diodeIG(v, Is, n, Vz) {
  const nvt = n * VT;
  const e1 = dexp(v / nvt);
  let I = Is * (e1 - 1), g = Is * e1 / nvt;
  if (Vz) { const e2 = dexp((-v - Vz) / nvt); I -= 1e-3 * e2; g += 1e-3 * e2 / nvt; }
  return [I + GMIN * v, g + GMIN];
}
function diodeStamp(e, s, Is, n, Vz) {
  const a = e.n[0], b = e.n[1];
  let v = s.v(a) - s.v(b);
  const nvt = n * VT, vcrit = nvt * Math.log(nvt / (Math.SQRT2 * Is));
  const vold = e.st.vd || 0;
  if (Vz && v < -Vz / 2) { v = -pnjlim(-v - Vz, -vold - Vz, nvt, vcrit) - Vz; }
  else v = pnjlim(v, vold, nvt, vcrit);
  e.st.vd = v;
  const [I, g] = diodeIG(v, Is, n, Vz);
  s.NL2(a, b, I, g, v);
}
function diodePost(e, s, Is, n, Vz) { e.st.i = diodeIG(pv(e, s, 0) - pv(e, s, 1), Is, n, Vz)[0]; }
const twoInfo = (e, s, i) => [['電圧', pv(e, s, 0) - pv(e, s, 1), 'V'], ['電流', i, 'A']];

function opampF(v) {
  const [vn, vp, vo, vpos, vneg] = v;
  const m = 0.1; let hi = vpos - m, lo = vneg + m;
  if (hi < lo) { const c = (hi + lo) / 2; hi = lo = c; }
  const mid = (hi + lo) / 2, half = Math.max((hi - lo) / 2, 1e-3);
  const E = mid + half * Math.tanh(1e5 * (vp - vn) / half);
  const io = (vo - E) / 1;
  let ipos = 0, ineg = 0;
  if (io < 0) ipos = -io; else ineg = -io;
  return [0, 0, io, ipos, ineg];
}
function regF(v) {

    assignLabel(circ, c); circ.comps.push(c);

  for (const path of pd.wires) for (let i = 0; i + 1 < path.length; i++) {
    const [x1, y1] = path[i], [x2, y2] = path[i + 1];
    circ.wires.push({ id: circ.nextId++, x1, y1, x2, y2 });
  }
  circ.probes = (pd.probes || []).map(([x, y, name]) => ({ x, y, name }));

    else if (g.start && S.preview) { addWires(g.start, S.preview, S.vfirst); S.pending = S.preview; S.preview = null; dirty = true; }
    return;
  }
  // タップ
  if (S.mode === 'select') {
    const c = hitComp(gx, gy);
    if (c) {
      if (c.t === 'SW') { c.p.on = !c.p.on; dirty = true; save(); toast(c.label + ' を ' + (c.p.on ? 'ON' : 'OFF') + ' にしました'); }
      select({ c: c.id });
    } else { const w = hitWire(gx, gy); if (w) select({ w: w.id }); else select(null); }
  } else if (S.mode === 'wire') {
    if (S.pending && S.pending[0] === px && S.pending[1] === py) { S.pending = null; S.preview = null; }
    else if (S.pending) { const a = S.pending; S.vfirst = false; addWires(a, [px, py], false); S.pending = [px, py]; S.preview = null; }
    else S.pending = [px, py];
    dirty = true;
  } else if (S.mode === 'place') {
    placeComp(S.placeType, px, py); setMode('select');
  } else if (S.mode === 'probe') {
    toggleProbe(px, py);
  } else if (S.mode === 'area') {
    select(null);
  }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => {

  const r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * .0015));
}, { passive: false });
function zoomAt(x, y, k) {

}

const sheet = $('#sheet');

function groupCoords(m) {
  return {
    c: S.circ.comps.filter(c => m.comps.has(c.id)).map(c => [c, c.x, c.y]),
    w: S.circ.wires.filter(w => m.wires.has(w.id)).map(w => [w, w.x1, w.y1, w.x2, w.y2]),
    p: m.probes.map(p => [p, p.x, p.y]), r: m.rect.slice()
  };
}
function moveGroup(m, dx, dy) {
  const o = m.orig; if (!o) return;
  o.c.forEach(([c, x, y]) => { c.x = x + dx; c.y = y + dy; });
  o.w.forEach(([w, a, b, c, d]) => { w.x1 = a + dx; w.y1 = b + dy; w.x2 = c + dx; w.y2 = d + dy; });
  o.p.forEach(([p, x, y]) => { p.x = x + dx; p.y = y + dy; });
  m.rect = [o.r[0] + dx, o.r[1] + dy, o.r[2] + dx, o.r[3] + dy];
  S.topo = topology(S.circ); S.sim = null; S.buf = null; S.vsm = null; dirty = true;
}
function selectArea(r) {
  const x0 = Math.min(r[0], r[2]), x1 = Math.max(r[0], r[2]), y0 = Math.min(r[1], r[3]), y1 = Math.max(r[1], r[3]);
  const inside = (x, y) => x >= x0 - 1e-9 && x <= x1 + 1e-9 && y >= y0 - 1e-9 && y <= y1 + 1e-9;
  const comps = new Set(S.circ.comps.filter(c => pinPos(c).every(([x, y]) => inside(x, y))).map(c => c.id));
  const wires = new Set(S.circ.wires.filter(w => inside(w.x1, w.y1) && inside(w.x2, w.y2)).map(w => w.id));
  const probes = S.circ.probes.filter(p => inside(p.x, p.y));
  if (!comps.size && !wires.size && !probes.length) { select(null); toast('範囲内に部品や配線がありません。部品の端子がすべて入るように囲んでください。'); return; }

}
function deleteMulti(m) {

  S.circ.wires = S.circ.wires.filter(w => !m.wires.has(w.id));
  S.circ.probes = S.circ.probes.filter(p => !m.probes.includes(p));
  const n = m.comps.size, k = m.wires.size;
  select(null); changed(true); toast(`部品 ${n} 個と配線 ${k} 本を削除しました。「戻す」で元に戻せます。`);
}
function closeSheet() { sheet.hidden = true; sheet.innerHTML = ''; }

  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'edit') { resize(); }
  if (v === 'pat') drawPatternThumbs();
  if (v === 'doc') drawDocIcons();
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => showView(b.dataset.v));

/* ---------- ボタン ---------- */
$('#bRun').onclick = () => setRunning(!S.running);
$('#bReset').onclick = () => { resetSim(); toast('時間を 0 に戻しました'); };
$('#bUndo').onclick = () => { if (!S.undo.length) return; restore(S.undo.pop(), true); updateTopbar(); };
$('#bMenu').onclick = openMenu;
$('#bExplain').onclick = () => S.pat && openPattern(S.pat);
$('#bScope').onclick = () => { S.scopeOn = !S.scopeOn; $('#scope').classList.toggle('collapsed', !S.scopeOn); $('#bScope').textContent = S.scopeOn ? '隠す' : '表示'; resize(); };
$('#zIn').onclick = () => zoomAt(W / 2, H / 2, 1.25);
$('#zOut').onclick = () => zoomAt(W / 2, H / 2, 0.8);
$('#zFit').onclick = fitView;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') { if (!modal.hidden) closeModal(); else if (S.mode !== 'select') setMode('select'); else select(null); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { const b = document.getElementById('sdel'); if (b) b.click(); }
  if (e.key === 'r' && S.sel && S.sel.c) { const b = document.getElementById('srot'); if (b) b.click(); }
  if (e.key === ' ' && modal.hidden) { e.preventDefault(); setRunning(!S.running); }
});

/* ---------- テーマ ---------- */
function themeChanged() { readColors(); dirty = true; drawScope(); drawPaletteIcons(); drawPatternThumbs(); drawDocIcons(); }
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged); } catch (e) { }
new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- 起動 ---------- */
(function init() {
  const th = store.get('kairo.theme'); if (th) document.documentElement.dataset.theme = th;
  readColors(); buildPalette(); buildPatterns(); buildDocs();
  const saved = store.get('kairo.current');
  const ok = saved && saved.circ && Array.isArray(saved.circ.comps) && saved.circ.comps.every(c => TYPES[c.t]);
  if (ok && (!saved.pat || saved.edited)) { S.circ = saved.circ; S.set = saved.set || S.set; S.pat = saved.pat || null; S.edited = true; if (!S.circ.probes) S.circ.probes = []; }
  else { S.circ = { comps: [], wires: [], probes: [], nextId: 1 }; S.pat = null; }
  setMode('select'); changed(true);
  new ResizeObserver(() => { if (!$('#v-edit').hidden) { const first = !W; resize(); if (first) fitView(); } }).observe($('#stage'));
  new ResizeObserver(() => drawScope()).observe(sc);
  resize(); fitView(); setRunning(false); updateTime();
  requestAnimationFrame(frame);
  if (document.fonts) document.fonts.ready.then(() => { dirty = true; drawPaletteIcons(); drawScope(); });
})();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
